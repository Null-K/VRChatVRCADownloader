[package]
name = "vrchat-vrca-downloader"
version = "2.0.3"
description = "VRChat VRCA Downloader"
authors = ["PuddingKC"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "vrchat_vrca_downloader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls", "cookies"], default-features = false }
tokio = { version = "1", features = ["full"] }
base64 = "0.22"
anyhow = "1"
futures-util = "0.3"
sha1 = "0.10"
hex = "0.4"
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
once_cell = "1"
# 加密
aes-gcm = "0.10"
sha2 = "0.10"
# WMI
[target.'cfg(windows)'.dependencies]
wmi = "0.14"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
